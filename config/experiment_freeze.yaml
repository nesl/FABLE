schema_version: fable.experiment_freeze.v1
freeze_version: pre-headline-physical-v1
execution_authorized: false
defaults:
  beam_width: 8
  random_seed: 34001
  retention: config/physical_retention.yaml
  physical_deployment: config/physical_devices.yaml
  physical_runtimes: config/physical_provider_runtimes.yaml
  physical_networks: config/physical_network_profiles.yaml
  desktop_profiles: evaluation/manifests/providers/calibrated_desktop_profiles.json
  physical_profiles:
    - profiles/physical/rpi_device_01.yaml
    - profiles/physical/orin_edge_01.yaml
    - profiles/physical/desktop_site_01.yaml
prepared_campaigns:
  e4_nominal_causal:
    command: scripts/run_physical_causal_orin7_case.sh
    guard_environment: FABLE_CONFIRM_EXPERIMENT=YES
    validation_experiment: 20241008-route-convoy-2-r013
    validation_result: evaluation/results/physical_causal_orin7_alt_r013_20260820/VALIDATION.json
    physical_source_check: passed
    distinct_entity_check: passed
    event_classification: TRUE_POSITIVE
    execution_ready: true
  e4_compute_contention:
    condition_trace: evaluation/manifests/adaptation/physical_e4_compute_contention.json
    policies: [B1_STATIC_WHOLE_EVENT, B3_TASK_RESOURCE_ADAPTIVE, FABLE]
    repetitions: 5
    execution_ready: true
    condition_executor: scripts/physical_condition_control.py
  e4_network_change:
    condition_trace: evaluation/manifests/adaptation/physical_e4_network_change.json
    policies: [B1_STATIC_WHOLE_EVENT, B3_TASK_RESOURCE_ADAPTIVE, FABLE]
    repetitions: 5
    execution_ready: true
    condition_executor: /usr/local/sbin/fable-physical-net
    restore_watchdog_seconds: 180
  e1_resume:
    manifest: final/rq1_full_20260806_pause/remaining_runs.jsonl
    command_file: final/rq1_full_20260806_pause/RESUME_COMMAND.txt
    execution_ready: true
  e2_planning:
    command: .venv/bin/python scripts/run_e2_contention_pilot.py --output evaluation/results/e2_headline_crossover --hypotheses 4 --beam-width 8 --condition RJCPU75 --network N0
    policies: [B4_GREEDY_FRONTIER, FABLE, O1_EXHAUSTIVE_ORACLE]
    beam_width_sensitivity: [1, 2, 4, 8, 16, 32]
    execution_ready: true
    readiness_gate: valid_discriminating_cell_and_live_runtime_frontier_export
    mechanism_result: evaluation/results/e2_headline_crossover_final_20260820/pilot.json
    live_runtime_snapshot: final/e2_headline_readiness_20260820/live_runtime_snapshot/s0000-r0000-01a02110-f2ef-704b-b4ee-766a619ac00d.json
    beam_sweep_result: final/e2_headline_readiness_20260820/live_snapshot_beam_sweep_v2.json
    remaining_blocker: null
    network_claim_enabled: false
    network_exclusion_reason: constrained network reprices the selected realization but does not change feasibility, chain, placement, or source
  e3_spatial_retrospective:
    runner: scripts/run_rq3_campaigns.py
    frozen_manifest: evaluation/manifests/spatial/rq3_matched_campaign_v1.yaml
    manifest_dir: evaluation/results/rq3_all_campaigns_20260731/manifests
    execution_ready: true
