schema_version: fable.physical_retention.v1

# Copy to physical_retention.yaml and use paths appropriate to each device.
physical_rpi:
  replay_cache: /var/lib/fable/replay-cache
  keep_current_videos: 1
  clear_frames_before_experiment: true

physical_jetson:
  state_dir: /var/lib/fable/state
  provider_log_dir: /var/log/fable/providers
