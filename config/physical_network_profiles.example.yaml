schema_version: fable.physical_network_profiles.v1

# Copy to physical_network_profiles.yaml and fill in lab-local peer addresses.
profiles:
  nominal:
    latency_ms: 1
    bandwidth_mbps: 1000

controlled_links:
  rpi_to_host:
    controller_host: rpi.example.invalid
    interface: eth0
    peer_ipv4: 192.0.2.10
  jetson_to_host:
    controller_host: jetson.example.invalid
    interface: eth0
    peer_ipv4: 192.0.2.10
