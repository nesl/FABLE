[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fable-language-rebuild"
version = "0.13.0"
description = "Simplified FABLE CE language, providers, frontiers, dynamic planning, distributed execution, and live provider dataflow"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]
vision = [
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "opencv-python>=4.9,<5",
  "ultralytics>=8.3,<9",
  "supervision>=0.25,<1",
]
audio = [
  "numpy>=1.26,<3",
  "tensorflow>=2.16,<3",
  "tensorflow-hub>=0.16,<1",
]
reid = [
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "opencv-python>=4.9,<5",
  "torchreid @ git+https://github.com/KaiyangZhou/deep-person-reid.git",
  "fastreid @ git+https://github.com/JDAI-CV/fast-reid.git",
]

[tool.setuptools.package-data]
fable = [
  "language/*.yaml",
  "providers/*.yaml",
  "providers/reid/*.yaml",
  "providers/reid/*.json",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fable*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
