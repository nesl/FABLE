[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fable-ce"
version = "0.13.0"
description = "Adaptive complex-event detection over distributed perception sources"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
distributed = [
  "paho-mqtt>=2,<3",
]
vision = [
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "opencv-python>=4.9,<5",
  "ultralytics>=8.3,<9",
  "supervision>=0.25,<1",
]
audio = [
  "numpy>=1.26,<3",
  "tensorflow>=2.16,<3",
  "tensorflow-hub>=0.16,<1",
]
reid = [
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "opencv-python>=4.9,<5",
  "torchreid @ git+https://github.com/KaiyangZhou/deep-person-reid.git",
  "fastreid @ git+https://github.com/JDAI-CV/fast-reid.git",
]

[tool.setuptools.package-data]
fable = [
  "language/*.yaml",
  "providers/*.yaml",
  "providers/reid/*.yaml",
  "providers/reid/*.json",
  "visualization/*.html",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fable*", "netwaggle*", "replay*", "deployment*"]
