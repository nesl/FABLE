# Additive Phase-7 vehicle-provider service. Use with compose.server.yaml,
# compose.replay.yaml, and compose.fable.yaml.
services:
  fable-vehicle-orin11:
    build:
      context: ..
      dockerfile: iobt-minimal-ce-replay/services/analytics/fable_vehicle_stack/Dockerfile
    image: fable/vehicle-stack:phase7
    container_name: fable-vehicle-orin11
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      SOURCE_ID: dvpg_gq_orin_11
      YOLO_TOPIC: /dvpg_gq_orin_11/analytics/yolo/bbox
      TRACK_TOPIC: /dvpg_gq_orin_11/fable/vehicle/tracks
      PREDICATE_TOPIC: /dvpg_gq_orin_11/fable/vehicle/predicates
      READINESS_TOPIC: /readiness/dvpg_gq_orin_11/fable_vehicle
      TRACKER_ALGORITHM: bytetrack
      VEHICLE_GEOMETRY_CONFIG: /workspace/replay/config/fable_vehicle_geometry.json
      LOG_LEVEL: INFO
    volumes:
      - ./config:/workspace/replay/config:ro
    depends_on:
      mqtt:
        condition: service_started
      yolo-orin11:
        condition: service_started
    restart: unless-stopped
