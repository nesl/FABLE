listener 1883 0.0.0.0
allow_anonymous true

# Phase 6 uses persistent Paho sessions and a SQLite application outbox. Broker
# persistence complements, but does not replace, application acknowledgments.
persistence true
persistence_location /mosquitto/data/
autosave_interval 5
max_queued_messages 10000
max_inflight_messages 100
persistent_client_expiration 7d

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
