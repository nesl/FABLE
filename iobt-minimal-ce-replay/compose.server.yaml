services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: iobt-minimal-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./server/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  web-ui:
    build:
      context: .
      dockerfile: web_ui/Dockerfile
      network: host
    container_name: iobt-minimal-web-ui
    environment:
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
      - "IOBT_DATA_ROOTS=/media/brianw/Extreme SSD/West Point Experimentation:/media/brianw/Extreme SSD/GQ Data"
    ports:
      - "8080:8080"
    depends_on:
      - mqtt
