services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: iobt-minimal-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./server/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  web-ui:
    build:
      context: .
      dockerfile: web_ui/Dockerfile
      network: host
    container_name: iobt-minimal-web-ui
    environment:
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
      - IOBT_DATA_ROOTS=/data_roots/west_point:/data_roots/gq
      - SCENARIO_CATALOG_DIR=/generated
    ports:
      - "8080:8080"
    volumes:
      - ./generated:/generated
      - "/media/brianw/Extreme SSD/West Point Experimentation:/data_roots/west_point:ro"
      - "/media/brianw/Extreme SSD/GQ Data:/data_roots/gq:ro"
    depends_on:
      - mqtt
