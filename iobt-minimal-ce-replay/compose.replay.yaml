# Scenario-agnostic persistent replay stack.
# Generated by setup/generate_replay_compose.py.
# Use the web UI or tools/replay_control.py to publish /replay/config and /replay/sync.
services:

  zed-orin11:
    build:
      context: .
      dockerfile: services/replay/zed/Dockerfile
      network: host
    image: iobt-minimal/zed-replay:latest
    container_name: zed-replay-orin11
    working_dir: /app
    command: "python3 -u /app/replay_entrypoint.py --service zed --node-folder orin11 --node-name dvpg_gq_orin_11 --downsample-for-mqtt 1.0"
    privileged: true
    gpus: all
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - "/media/brianw/Extreme SSD/West Point Experimentation:/data_roots/west_point:ro"
      - "/media/brianw/Extreme SSD/GQ Data:/data_roots/gq:ro"
      - "/home/brianw/Documents/FABLE/iobt-minimal-ce-replay/setup/zed_settings:/usr/local/zed/settings/:ro"
      - "/tmp/iobt-orin11:/tmp"
    environment:
      - TEST_CONTROL=False
      - MCP_NODE_NAME=dvpg_gq_orin_11
      - MQTT_HOST_IP=${MQTT_HOST_IP:-host.docker.internal}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MCP_CONTAINER_OUTPUT_DIR=/output
      - SERIALIZER=msgpack
      - IOBT_DATA_ROOTS=/data_roots/west_point:/data_roots/gq
      - IOBT_NODE_FOLDER=orin11

  yolo-orin11:
    build:
      context: .
      dockerfile: services/analytics/yolo_detector/Dockerfile
      network: host
    image: iobt-minimal/yolo-detector:latest
    container_name: yolo-detector-orin11
    working_dir: /app
    command: python3 -u /app/app.py
    gpus: all
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "/tmp/iobt-orin11:/tmp"
    environment:
      - TEST_CONTROL=False
      - MCP_NODE_NAME=dvpg_gq_orin_11
      - MQTT_HOST_IP=${MQTT_HOST_IP:-host.docker.internal}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MCP_CONTAINER_OUTPUT_DIR=/tmp
      - SERIALIZER=msgpack
      - SOURCE=local
      - LOAD_MODEL=true
      - YOLO_MODEL=/app/yolov8n.pt
      - YOLO_DEVICE=${YOLO_DEVICE:-auto}
      - YOLO_PUBLISH_ANNOTATED=true
      - YOLO_ANNOTATED_FPS=1.0
      - YOLO_PUBLISH_STATUS=true
      - YOLO_PUBLISH_FRAME_STATUS=true
      - YOLO_STATUS_FPS=1.0
      - YOLO_FRAME_STATUS_FPS=1.0
      - YOLO_ANNOTATED_WIDTH=960
      - YOLO_ANNOTATED_JPEG_QUALITY=70
