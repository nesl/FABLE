# Scenario-agnostic persistent replay stack.
# Generated by setup/generate_replay_compose.py.
# Use the web UI or tools/replay_control.py to publish /replay/config and /replay/sync.
services:

  respeaker-gps2:
    build:
      context: .
      dockerfile: services/replay/respeaker/Dockerfile
      network: host
    image: iobt-minimal/respeaker-replay:latest
    container_name: respeaker-replay-gps2
    working_dir: /app
    command: "python3 -u /app/replay_entrypoint.py --service respeaker --node-folder gps2 --node-name gps2"
    privileged: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - "/media/brianw/Extreme SSD/West Point Experimentation:/data_roots/west_point:ro"
      - "/media/brianw/Extreme SSD/GQ Data:/data_roots/gq:ro"
      - "/tmp/iobt-gps2:/tmp"
    environment:
      - TEST_CONTROL=False
      - MCP_NODE_NAME=gps2
      - MQTT_HOST_IP=${MQTT_HOST_IP:-host.docker.internal}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MCP_CONTAINER_OUTPUT_DIR=/output
      - SERIALIZER=msgpack
      - IOBT_DATA_ROOTS=/data_roots/west_point:/data_roots/gq
      - IOBT_NODE_FOLDER=gps2

  audio-detector-gps2:
    build:
      context: .
      dockerfile: services/analytics/audio_detector/Dockerfile
      network: host
    image: iobt-minimal/audio-detector:latest
    container_name: audio-detector-gps2
    working_dir: /app
    command: python3 -u /app/app.py
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "/tmp/iobt-gps2:/tmp"
    environment:
      - TEST_CONTROL=False
      - MCP_NODE_NAME=gps2
      - MQTT_HOST_IP=${MQTT_HOST_IP:-host.docker.internal}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MCP_CONTAINER_OUTPUT_DIR=/tmp
      - SERIALIZER=msgpack
      - DETECTION_THRESHOLD=-30.0

