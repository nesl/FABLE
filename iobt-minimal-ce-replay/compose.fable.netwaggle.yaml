# Network-placement override for use with compose.netwaggle.yaml.
# Apply after compose.fable.yaml so these network_mode and endpoint values win.
services:
  fable-mongo:
    network_mode: service:netwaggle-node-cloud1
    depends_on:
      netwaggle-node-cloud1:
        condition: service_started

  fable-orchestrator:
    network_mode: service:netwaggle-node-cloud1
    environment:
      MQTT_HOST_IP: ${MQTT_HOST_IP:-10.255.0.1}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MONGODB_URI: mongodb://127.0.0.1:27017
    depends_on:
      fable-mongo:
        condition: service_healthy
      netwaggle-node-cloud1:
        condition: service_started

  fable-agent-orin11:
    network_mode: service:netwaggle-node-orin11
    environment:
      MQTT_HOST_IP: ${MQTT_HOST_IP:-10.255.0.1}
      MQTT_PORT: ${MQTT_PORT:-1883}
    depends_on:
      netwaggle-node-orin11:
        condition: service_started
      fable-orchestrator:
        condition: service_started

  fable-agent-x86server:
    network_mode: service:netwaggle-node-cloud1
    environment:
      MQTT_HOST_IP: ${MQTT_HOST_IP:-10.255.0.1}
      MQTT_PORT: ${MQTT_PORT:-1883}
      FABLE_NODE_ID: cloud1
      FABLE_MQTT_CLIENT_ID: fable-agent-cloud1
      FABLE_STATE_DIR: /var/lib/fable/cloud1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - fable-agent-x86server-state:/var/lib/fable/cloud1
    depends_on:
      netwaggle-node-cloud1:
        condition: service_started
      fable-orchestrator:
        condition: service_started
