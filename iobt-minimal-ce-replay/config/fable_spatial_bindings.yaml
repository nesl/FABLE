schema_version: fable.spatial_sensor_bindings.v1
# Fixed topology sensors use stable site identifiers. Change the runtime source
# and node names below to match the replay/deployment configuration.
sensors:
  orin_1: {source_ids: [orin1_camera], node_ids: [dvpg_gq_orin_1]}
  orin_2: {source_ids: [orin2_camera], node_ids: [dvpg_gq_orin_2]}
  orin_3: {source_ids: [orin3_camera], node_ids: [dvpg_gq_orin_3]}
  orin_4: {source_ids: [orin4_camera], node_ids: [dvpg_gq_orin_4]}
  orin_5: {source_ids: [orin5_camera], node_ids: [dvpg_gq_orin_5]}
  orin_6: {source_ids: [orin6_camera], node_ids: [dvpg_gq_orin_6]}
  orin_7: {source_ids: [orin7_camera], node_ids: [dvpg_gq_orin_7]}
  orin_8: {source_ids: [orin8_camera], node_ids: [dvpg_gq_orin_8]}
  orin_9: {source_ids: [orin9_camera], node_ids: [dvpg_gq_orin_9]}
  orin_10: {source_ids: [orin10_camera], node_ids: [dvpg_gq_orin_10]}

# Scenario-local mobile labels are intentionally bound per deployment. A label
# such as d1 does not identify one permanent geographic sensor.
deployments:
  2024_temporal_ce1:
    sensors:
      n1: {source_ids: [temporal_ce1_n1_camera], node_ids: [temporal_ce1_n1]}
      n2: {source_ids: [temporal_ce1_n2_camera], node_ids: [temporal_ce1_n2]}
      n3: {source_ids: [temporal_ce1_n3_camera], node_ids: [temporal_ce1_n3]}
  2024_temporal_ce2_page5:
    sensors:
      n1: {source_ids: [temporal_ce2_p5_n1_camera], node_ids: [temporal_ce2_p5_n1]}
      n2: {source_ids: [temporal_ce2_p5_n2_camera], node_ids: [temporal_ce2_p5_n2]}
      n3: {source_ids: [temporal_ce2_p5_n3_camera], node_ids: [temporal_ce2_p5_n3]}
  2024_temporal_ce2_page6:
    sensors:
      n1: {source_ids: [temporal_ce2_p6_n1_camera], node_ids: [temporal_ce2_p6_n1]}
      n2: {source_ids: [temporal_ce2_p6_n2_camera], node_ids: [temporal_ce2_p6_n2]}
      n3: {source_ids: [temporal_ce2_p6_n3_camera], node_ids: [temporal_ce2_p6_n3]}
  2025_package_exchange:
    sensors:
      d1: {source_ids: [package_d1_camera], node_ids: [package_d1]}
      d2: {source_ids: [package_d2_camera], node_ids: [package_d2]}
      d3: {source_ids: [package_d3_camera], node_ids: [package_d3]}
  2025_flee_police:
    sensors:
      d1: {source_ids: [flee_d1_camera], node_ids: [flee_d1]}
      d2: {source_ids: [flee_d2_camera], node_ids: [flee_d2]}
      d3: {source_ids: [flee_d3_camera], node_ids: [flee_d3]}
  2025_robbery:
    sensors:
      d1: {source_ids: [robbery_d1_camera], node_ids: [robbery_d1]}
      d2: {source_ids: [robbery_d2_camera], node_ids: [robbery_d2]}
      d3: {source_ids: [robbery_d3_camera], node_ids: [robbery_d3]}
