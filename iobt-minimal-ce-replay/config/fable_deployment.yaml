schema_version: fable.deployment.v1
nodes:
  dvpg_gq_orin_11:
    node_class: sensor
    region: west_point_replay
    capacity:
      cpu_cores: 8
      memory_mb: 16384
      gpu_memory_mb: 8192
    capabilities: [vision, audio, gpu, replay]
    policy_tags: [raw-local]

  x86server:
    node_class: server
    region: server
    capacity:
      cpu_cores: 16
      memory_mb: 65536
      gpu_memory_mb: 24576
    capabilities: [vision, audio, gpu, orchestration, replay]

  cloud1:
    node_class: server
    region: cloud
    capacity:
      cpu_cores: 16
      memory_mb: 65536
      gpu_memory_mb: 24576
    capabilities: [vision, audio, gpu, orchestration, replay]

sources:
  orin11_camera:
    node_id: dvpg_gq_orin_11
    region: west_point_replay
    modalities: [vision]
    live_data_types: [raw_video_frames.v1]
    coverage_regions: [west_point_replay]
    policy_tags: [raw-local]
  orin11_microphone:
    node_id: dvpg_gq_orin_11
    region: west_point_replay
    modalities: [audio]
    live_data_types: [audio_segment.v1]
    coverage_regions: [west_point_replay]
    policy_tags: [raw-local]
  replay_gps:
    node_id: x86server
    region: west_point_replay
    modalities: [location]
    live_data_types: [gps_fix.v1]
    coverage_regions: [west_point_replay]

links:
  - source_node_id: dvpg_gq_orin_11
    target_node_id: x86server
    latency_ms: 2
    bandwidth_mbps: 1000
    bidirectional: true
  - source_node_id: dvpg_gq_orin_11
    target_node_id: cloud1
    latency_ms: 8
    bandwidth_mbps: 100
    bidirectional: true
  - source_node_id: x86server
    target_node_id: cloud1
    latency_ms: 5
    bandwidth_mbps: 1000
    bidirectional: true
