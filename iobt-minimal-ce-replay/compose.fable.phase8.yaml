# Additive Phase-8 multimodal/interaction provider. Use with the existing
# replay and FABLE overlays. Raw ReSpeaker samples remain on local IPC.
services:
  fable-multimodal-orin11:
    build:
      context: ..
      dockerfile: iobt-minimal-ce-replay/services/analytics/fable_multimodal_stack/Dockerfile
      args:
        FABLE_MODEL_EXTRAS: ${FABLE_MODEL_EXTRAS:-0}
    image: fable/multimodal-stack:phase8
    container_name: fable-multimodal-orin11
    working_dir: /workspace/FABLE
    environment:
      TEST_CONTROL: "False"
      MCP_NODE_NAME: dvpg_gq_orin_11
      MQTT_HOST_IP: ${MQTT_HOST_IP:-host.docker.internal}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MCP_CONTAINER_OUTPUT_DIR: /tmp
      SERIALIZER: msgpack
      SOURCE_ID: dvpg_gq_orin_11
      YOLO_TOPIC: /dvpg_gq_orin_11/analytics/yolo/bbox
      AUDIO_EVENT_TOPIC: /dvpg_gq_orin_11/fable/audio/events
      AUDIO_LOCALIZATION_TOPIC: /dvpg_gq_orin_11/fable/audio/localizations
      SPEECH_TURN_TOPIC: /dvpg_gq_orin_11/fable/audio/speaker_turns
      CONTEXT_TRACK_TOPIC: /dvpg_gq_orin_11/fable/context/tracks
      INTERACTION_TOPIC: /dvpg_gq_orin_11/fable/interactions/predicates
      CUSTODY_TOPIC: /dvpg_gq_orin_11/fable/interactions/custody
      READINESS_TOPIC: /readiness/dvpg_gq_orin_11/fable_multimodal
      FABLE_AUDIO_GEOMETRY: /workspace/replay/config/fable_multimodal_geometry.json
      AUDIO_CHANNEL_INDICES: 1,2,3,4
      TRACKER_ALGORITHM: bytetrack
      FABLE_VISUAL_IMAGE_WIDTH_PX: ${FABLE_VISUAL_IMAGE_WIDTH_PX:-1280}
      FABLE_CAMERA_HORIZONTAL_FOV_DEG: ${FABLE_CAMERA_HORIZONTAL_FOV_DEG:-90}
      FABLE_VISUAL_BEARING_OFFSET_DEG: ${FABLE_VISUAL_BEARING_OFFSET_DEG:-0}
      FABLE_VISUAL_ZONE_ID: ${FABLE_VISUAL_ZONE_ID:-front}
      FABLE_AV_TIME_TOLERANCE_SECONDS: ${FABLE_AV_TIME_TOLERANCE_SECONDS:-0.5}
      # The dependency-light baseline is useful for stack validation only.
      # Set "yamnet" and mount/configure a pinned checkpoint + class map for
      # evaluation-quality gunshot/alarm experiments.
      FABLE_AUDIO_BACKEND: ${FABLE_AUDIO_BACKEND:-spectral-rule}
      FABLE_YAMNET_MODEL_HANDLE: ${FABLE_YAMNET_MODEL_HANDLE:-}
      FABLE_YAMNET_CLASS_MAP: ${FABLE_YAMNET_CLASS_MAP:-}
      FABLE_YAMNET_MODEL_VERSION: ${FABLE_YAMNET_MODEL_VERSION:-}
    volumes:
      - ./config:/workspace/replay/config:ro
      - /tmp/iobt-orin11:/tmp
      - ${FABLE_MODEL_DIR:-./models}:/models:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      yolo-orin11:
        condition: service_started
      respeaker-orin11:
        condition: service_started
    restart: unless-stopped
