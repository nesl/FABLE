<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FABLE Live Devices</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1018;--panel:#131b28;--line:#29364a;--muted:#94a3b8;--accent:#34d399}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:#eef2ff;font:14px system-ui,sans-serif}
    header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line)}
    h1{font-size:20px;margin:0} a{color:#93c5fd;text-decoration:none}.sub{color:var(--muted);margin-top:4px}
    #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),520px));justify-content:center;gap:16px;padding:16px;align-items:start}
    .device{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
    .view{aspect-ratio:16/9;background:#030712;display:grid;place-items:center}.view img{width:100%;height:100%;object-fit:contain}
    .meta{display:flex;justify-content:space-between;gap:12px;padding:11px 13px}.name{font-weight:700}.detail{color:var(--muted);text-align:right}
    #empty{padding:56px;text-align:center;color:var(--muted);grid-column:1/-1}.live{color:var(--accent)}
  </style>
</head>
<body>
  <header><div><h1>Live replay devices <span id="camera-count" class="sub">(0 cameras)</span></h1><div class="sub">Orange = YOLO detection · Green = track identity</div></div><a href="/">Event dashboard →</a></header>
  <main id="grid"><div id="empty">Waiting for replay camera frames…</div></main>
  <script>
    const grid=document.querySelector('#grid'); let known=new Map();
    function make(d){const card=document.createElement('section');card.className='device';card.innerHTML=`<div class="view"><img alt=""></div><div class="meta"><div><div class="name"></div><div class="sub status"></div></div><div class="detail"></div></div>`;grid.append(card);known.set(d.source_id,card);return card}
    async function sync(){try{const rows=await fetch('/api/devices',{cache:'no-store'}).then(r=>r.json());document.querySelector('#camera-count').textContent=`(${rows.length} camera${rows.length===1?'':'s'})`;if(rows.length)document.querySelector('#empty')?.remove();for(const d of rows){const c=known.get(d.source_id)||make(d);c.querySelector('.name').textContent=d.source_id;c.querySelector('.status').innerHTML=d.age_seconds<2?'<span class="live">● LIVE</span>':'paused · '+d.age_seconds+'s ago';c.querySelector('.detail').textContent=d.annotation_kind+' · '+d.annotation_count+' objects'+(d.origin_node?' · '+d.origin_node:'');if(d.has_frame)c.querySelector('img').src='/api/devices/'+encodeURIComponent(d.source_id)+'/frame.jpg?width=640&v='+Date.now()}}catch(e){console.warn(e)}}
    sync();setInterval(sync,1000);
  </script>
</body></html>
