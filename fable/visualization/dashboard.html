<!doctype html>
<!-- Adapted from mobile_data_collector/event-detector/services/visualization.html. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FABLE CE Progress</title><style>
*{box-sizing:border-box}body{margin:24px;font-family:Arial,sans-serif;color:#222}h1{margin:0;font-size:25px}h2{margin:24px 0 10px;font-size:19px}.header{display:flex;justify-content:space-between;align-items:center}.lifecycle{margin:18px 0;padding:11px 14px;border-radius:7px;background:#eff6ff;color:#1e3a8a;font-weight:bold}.counts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.devices-link{color:#1d4ed8;text-decoration:none;font-weight:bold}.badge{padding:7px 11px;border-radius:14px;background:#eee;font-size:13px}.active-badge{background:#fef3c7;color:#92400e}.complete-badge{background:#dcfce7;color:#166534}.expired-badge{background:#fee2e2;color:#991b1b}.layout{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:20px}.panel{border:1px solid #ccc;min-height:420px}.instances{max-height:620px;overflow-y:auto}.instance{display:block;width:100%;border:0;border-bottom:1px solid #ddd;background:#fff;text-align:left;padding:12px;cursor:pointer}.instance:hover,.instance.selected{background:#eff6ff}.instance-line{display:flex;justify-content:space-between;gap:8px}.instance small{display:block;color:#666;margin-top:5px;overflow-wrap:anywhere}.status{font-size:12px;text-transform:uppercase}.status.completed{color:#15803d}.status.expired{color:#b91c1c}.status.active{color:#a16207}.detail{padding:18px;overflow:hidden}.bindings{font:13px monospace;color:#555;margin-bottom:28px}.stages{display:flex;align-items:center;justify-content:center;width:100%;min-width:0;margin:auto;padding:34px 4px}.stage{flex:1 1 0;min-width:90px;max-width:165px;min-height:108px;border:2px solid #888;border-radius:50%;padding:16px 8px;text-align:center;background:#fff;display:flex;align-items:center;justify-content:center}.stage.active{border-color:#dc2626;background:#fee2e2;color:#991b1b}.stage.done{border-color:#16a34a;background:#dcfce7}.stage.failed{border-color:#991b1b;background:#fecaca}.stage-arrow{width:clamp(18px,4vw,48px);height:2px;background:#777;position:relative;flex:0 1 48px}.stage-arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:9px solid #777;border-top:6px solid transparent;border-bottom:6px solid transparent}.lead{color:#1d4ed8;font-size:12px;font-weight:bold;margin-top:5px}.progress{color:#666;font-size:12px;margin-top:5px}.follow{float:right;border:1px solid #999;border-radius:12px;background:#fff;padding:4px 9px;cursor:pointer}.empty{color:#777;padding:14px}@media(max-width:760px){.layout{grid-template-columns:1fr}.panel{min-height:180px}.stage{min-width:76px;font-size:13px}}
</style></head><body>
<div class="header"><div><h1 id="event-name">FABLE CE Progress</h1><div id="description"></div></div><div class="counts"><a class="devices-link" href="/devices">Live devices →</a><span id="session-status" class="badge">idle</span><span id="total-count" class="badge">0 total</span><span id="active-count" class="badge active-badge">0 active</span><span id="completed-count" class="badge complete-badge">0 completed</span><span id="expired-count" class="badge expired-badge">0 expired</span></div></div>
<div id="lifecycle" class="lifecycle">Waiting for replay</div>
<div class="layout"><section><h2>Instances (<span id="instance-heading-count">0</span>)</h2><div id="instances" class="panel instances"><div class="empty">No CE instances yet.</div></div></section><section><h2>Selected instance</h2><div id="detail" class="panel detail"><div class="empty">Select an instance to inspect its progress.</div></div></section></div>
<script>
let selectedId=null,manualSelection=false;
const esc=s=>String(s??"");
function nodeState(node,instance){const path=node.path,sat=new Set(instance.satisfied_paths),active=new Set(instance.active_paths),failed=instance.failed_paths||{};if(path in failed)return["failed",failed[path]];if(sat.has(path))return["done","Completed"];if(active.has(path)||node.children.some(child=>nodeState(child,instance)[0]==="active"))return["active","Active"];return["waiting","Waiting"]}
function renderNode(node,instance){const li=document.createElement("li"),box=document.createElement("div"),[state,detail]=nodeState(node,instance);box.className=`node ${node.kind} ${state}`;const label=document.createElement("span");label.textContent=node.label;const small=document.createElement("small");small.textContent=detail;box.append(label,small);li.append(box);if(node.children.length){const ul=document.createElement("ul");node.children.forEach(child=>ul.append(renderNode(child,instance)));li.append(ul)}return li}
function stageState(stage,instance){const sat=new Set(instance.satisfied_paths),active=new Set(instance.active_paths),failed=instance.failed_paths||{},leaves=stage.leaf_paths,prerequisites=stage.activation_paths||[];if(stage.path in failed||leaves.some(path=>path in failed))return"failed";if(sat.has(stage.path)||leaves.every(path=>sat.has(path)))return"done";if(prerequisites.length&&!prerequisites.every(path=>sat.has(path)))return"waiting";if(active.has(stage.path)||leaves.some(path=>active.has(path)||sat.has(path)))return"active";return"waiting"}
function select(data,id,manual=false){if(manual)manualSelection=true;selectedId=id;let instance=data.instances.find(row=>row.instance_id===id),detail=document.getElementById("detail");document.querySelectorAll(".instance").forEach(row=>row.classList.toggle("selected",row.dataset.id===id));const waiting=!instance;if(waiting)instance={instance_id:"Authored event structure",status:"waiting",bindings:{},satisfied_paths:[],active_paths:[],failed_paths:{}};const title=document.createElement("h3");title.textContent=waiting?"What FABLE is looking for":`${instance.instance_id} · ${instance.status}`;const bindings=document.createElement("div");bindings.className="bindings";bindings.textContent=waiting?"Stages will update as matching observations arrive.":(Object.keys(instance.bindings).length?Object.entries(instance.bindings).map(([role,value])=>`${role} = ${value}`).join(" · "):"No role bindings");const stages=document.createElement("div");stages.className="stages";(data.event.stages||[]).forEach((stage,index)=>{if(index){const arrow=document.createElement("div");arrow.className="stage-arrow";stages.append(arrow)}const box=document.createElement("div"),state=stageState(stage,instance);box.className=`stage ${state}`;box.textContent=stage.label;stages.append(box)});detail.replaceChildren(title,bindings,stages)}
function render(data){document.getElementById("event-name").textContent=data.event.name.replaceAll("_"," ");document.getElementById("description").textContent=data.event.description||"";const lifecycle={waiting_for_replay:"Waiting for replay",replay_started:"Replay started",replay_completed:"Replay completed",replay_failed:"Replay failed",idle:"Waiting for replay",running:"Replay started",completed:"Replay completed",failed:"Replay failed"};const sessionStatus=data.session?.status||"waiting_for_replay",statusText=lifecycle[sessionStatus]||sessionStatus.replaceAll("_"," ");document.getElementById("session-status").textContent=statusText;document.getElementById("lifecycle").textContent=statusText;const total=data.counts.total??data.instances.length;document.getElementById("total-count").textContent=`${total} total`;document.getElementById("instance-heading-count").textContent=total;for(const status of ["active","completed","expired"])document.getElementById(`${status}-count`).textContent=`${data.counts[status]} ${status}`;const list=document.getElementById("instances"),rows=data.instances.map(instance=>{const button=document.createElement("button");button.className="instance";button.dataset.id=instance.instance_id;const line=document.createElement("div");line.className="instance-line";const name=document.createElement("strong");name.textContent=instance.instance_id;const status=document.createElement("span");status.className=`status ${instance.status}`;status.textContent=instance.status;line.append(name,status);const bindings=document.createElement("small");bindings.textContent=Object.entries(instance.bindings).map(([role,value])=>`${role}=${value}`).join(", ")||"No bindings";const progress=document.createElement("div");progress.className="progress";progress.textContent=`${instance.progress?.satisfied??0} of ${instance.progress?.total??0} conditions matched`;button.append(line,bindings,progress);button.onclick=()=>select(data,instance.instance_id,true);return button});list.replaceChildren(...(rows.length?rows:[Object.assign(document.createElement("div"),{className:"empty",textContent:"No CE instances yet."})]));if(!manualSelection||!data.instances.some(row=>row.instance_id===selectedId))selectedId=data.lead_instance_id??null;select(data,selectedId)}
async function refresh(){try{render(await(await fetch("/api/state",{cache:"no-store"})).json())}catch(_){}}refresh();setInterval(refresh,750);
</script></body></html>
