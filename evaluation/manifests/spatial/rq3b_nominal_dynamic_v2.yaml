schema_version: fable.rq3b_spatial_v2.v1
network_profile: N0
execution_order: trace_major_dynamic_first
policies:
  - S0_NO_HANDOFF
  - S1_BROADCAST
  - S2_TOPOLOGY_ONLY
  - S3_RESOURCE_AWARE_TOPOLOGY
  - FABLE_SPATIAL
  - O_SPACE
maximum_active_sensors: 2
require_canonical_object_binding: true
require_post_frontier_lookout_activation: true
traces:
  - experiment_id: 20241008-route-convoy-1-r012
    evidence_class: dynamic_spatial
  - experiment_id: 20241008-vehicle-convergence-1-r004
    evidence_class: dynamic_spatial
  - experiment_id: 20250812-vehicle-rendezvous-brianjulian-2-r027
    evidence_class: dynamic_spatial
  - experiment_id: 20250812-robbery-with-alarm-burglary-a-r009
    evidence_class: non_dynamic_control
metrics:
  - timely_handoff_recall
  - sensor_targeting_precision
  - false_wakeup_rate
  - provider_ready_lookout_lead_time_seconds
  - downstream_provider_active_seconds
  - downstream_transmitted_bytes
notes:
  - Nominal network conditions only; no L1 spatial disturbance is required.
  - The oracle is an upper bound and must not be treated as an online competitor.
  - 2026 traces remain excluded because their sensor topology is unknown.
