schema_version: fable.data_types.v1
data_types:
  raw_video_frames.v1:
    description: Timestamped video frames or a bounded decoded video interval from one camera.
    kind: raw_sensor
    modality: vision
    temporal:
      shape: sequence
      clock: event_time
    required_bindings:
    - source_id
    - event_interval
    encodings:
    - name: numpy_bgr8
      media_type: application/x-numpy
    - name: h264_segment
      media_type: video/h264
    transport:
      inline_allowed: false
      artifact_reference_allowed: true
      transferable: policy_dependent
      remote_reference_allowed: true
    retention_class: raw_sensor_short
    continuation:
      eligible: true
      category: replayable_source_evidence
    semantic_properties:
      preserves:
      - appearance
      - geometry
      - temporal_context
      - open_ended_reprocessing
  camera_calibration.v1:
    description: Camera intrinsics, extrinsics, homography, coordinate-frame identity, and validity interval.
    kind: deployment_metadata
    modality: vision
    temporal:
      shape: validity_interval
      clock: event_time
    required_bindings:
    - source_id
    - coordinate_frame_id
    encodings:
    - name: json
      media_type: application/json
    transport:
      inline_allowed: true
      artifact_reference_allowed: true
      transferable: true
      remote_reference_allowed: true
    retention_class: deployment_lifetime
    continuation:
      eligible: false
  route_graph.v1:
    description: Named route segments, connectivity, direction, and route-relative coordinates.
    kind: deployment_metadata
    modality: spatial
    temporal:
      shape: validity_interval
      clock: event_time
    required_bindings:
    - deployment_id
    encodings:
    - name: json
      media_type: application/json
    transport:
      inline_allowed: true
      artifact_reference_allowed: true
      transferable: true
      remote_reference_allowed: true
    retention_class: deployment_lifetime
    continuation:
      eligible: false
  detection_set.v1:
    description: Timestamped object detections with class labels, confidences, and image-space boxes.
    kind: derived_evidence
    modality: vision
    temporal:
      shape: sequence
      clock: event_time
    required_bindings:
    - source_id
    - event_interval
    encodings:
    - name: msgpack
      media_type: application/msgpack
    - name: json
      media_type: application/json
    transport:
      inline_allowed: true
      inline_max_bytes: 262144
      artifact_reference_allowed: true
      transferable: true
      remote_reference_allowed: true
    retention_class: derived_short
    continuation:
      eligible: true
      category: reusable_evidence
    semantic_properties:
      preserves:
      - object_class
      - image_geometry
      - event_time
      does_not_preserve:
      - cross_frame_identity
  track_set.v1:
    description: Sensor-local object tracks with track identifiers and image-space trajectories.
    kind: derived_evidence
    modality: vision
    temporal:
      shape: sequence
      clock: event_time
    required_bindings:
    - source_id
    - event_interval
    compatibility_keys:
    - tracker_family
    - track_schema_version
    encodings:
    - name: msgpack
      media_type: application/msgpack
    - name: parquet
      media_type: application/vnd.apache.parquet
    transport:
      inline_allowed: true
      inline_max_bytes: 262144
      artifact_reference_allowed: true
      transferable: true
      remote_reference_allowed: true
    retention_class: derived_short
    continuation:
      eligible: true
      category: reusable_evidence
    semantic_properties:
      preserves:
      - sensor_local_identity
      - image_geometry
      - motion
      - temporal_continuity
      does_not_preserve:
      - detailed_appearance
      - canonical_cross_sensor_identity
  projected_track_set.v1:
    description: Tracks projected into a named world, ground-plane, or route-relative coordinate frame.
    kind: derived_evidence
    modality: spatial
    temporal:
      shape: sequence
      clock: event_time
    required_bindings:
    - source_id
    - event_interval
    - coordinate_frame_id
    compatibility_keys:
    - coordinate_frame_id
    - projection_version
    encodings:
    - name: msgpack
      media_type: application/msgpack
    - name: parquet
      media_type: application/vnd.apache.parquet
    transport:
      inline_allowed: true
      inline_max_bytes: 262144
      artifact_reference_allowed: true
      transferable: true
      remote_reference_allowed: true
    retention_class: derived_short
    continuation:
      eligible: true
      category: reusable_evidence
    semantic_properties:
      preserves:
      - sensor_local_identity
      - world_geometry
      - motion
      - temporal_continuity
  image_crop_set.v1:
    description: Quality-filtered image crops associated with one or more local tracks and source frames.
    kind: derived_evidence
    modality: vision
    temporal:
      shape: sequence
      clock: event_time
    required_bindings:
    - source_id
    - event_interval
    - local_entity_ids
    encodings:
    - name: jpeg_bundle
      media_type: application/zip
    - name: tensor_nchw
      media_type: application/x-numpy
    transport:
      inline_allowed: false
      artifact_reference_allowed: true
      transferable: policy_dependent
      remote_reference_allowed: true
    retention_class: derived_short
    continuation:
      eligible: true
      category: reusable_evidence
    semantic_properties:
      preserves:
      - focused_appearance
      - source_frame_provenance
      does_not_preserve:
      - full_scene_context
  vehicle_reid_embedding_set.v1:
    description: Model-versioned vehicle identity embeddings for one or more local tracks.
    kind: feature
    modality: vision
    temporal:
      shape: sequence
      clock: event_time
    required_bindings:
    - source_id
    - event_interval
    - local_entity_ids
    compatibility_keys:
    - model_id
    - model_version
    - preprocessing_id
    - dimension
    - normalization
    - distance_metric
    encodings:
    - name: numpy_f32
      media_type: application/x-numpy
    - name: msgpack_f32
      media_type: application/msgpack
    transport:
      inline_allowed: true
      inline_max_bytes: 262144
      artifact_reference_allowed: true
      transferable: true
      remote_reference_allowed: true
    retention_class: derived_short
    continuation:
      eligible: true
      category: reusable_evidence
    semantic_properties:
      preserves:
      - task_specific_appearance_similarity
      does_not_preserve:
      - exact_pixels
      - world_geometry
      - open_ended_semantics
  canonical_entity_map.v1:
    description: Associations from sensor-local entity identifiers to canonical event-level entity identifiers.
    kind: derived_evidence
    modality: multimodal
    temporal:
      shape: validity_interval
      clock: event_time
    required_bindings:
    - event_interval
    encodings:
    - name: json
      media_type: application/json
    transport:
      inline_allowed: true
      artifact_reference_allowed: true
      transferable: true
      remote_reference_allowed: true
    retention_class: derived_short
    continuation:
      eligible: true
      category: reusable_evidence
    semantic_properties:
      preserves:
      - canonical_cross_sensor_identity
      - association_provenance
  pair_trajectory.v1:
    description: Time-aligned relative trajectory history for a bound pair of entities.
    kind: derived_evidence
    modality: spatial
    temporal:
      shape: sequence
      clock: event_time
    required_bindings:
    - event_interval
    - entity_pair
    compatibility_keys:
    - coordinate_frame_id
    encodings:
    - name: msgpack
      media_type: application/msgpack
    transport:
      inline_allowed: true
      inline_max_bytes: 262144
      artifact_reference_allowed: true
      transferable: true
      remote_reference_allowed: true
    retention_class: derived_short
    continuation:
      eligible: true
      category: reusable_evidence
    semantic_properties:
      preserves:
      - relative_geometry
      - relative_motion
      - temporal_continuity
  audio_segment.v1:
    description: Timestamped raw or decoded audio over a bounded event-time interval.
    kind: raw_sensor
    modality: audio
    temporal:
      shape: sequence
      clock: event_time
    required_bindings:
    - source_id
    - event_interval
    encodings:
    - name: wav_pcm16
      media_type: audio/wav
    - name: numpy_f32
      media_type: application/x-numpy
    transport:
      inline_allowed: false
      artifact_reference_allowed: true
      transferable: policy_dependent
      remote_reference_allowed: true
    retention_class: raw_sensor_short
    continuation:
      eligible: true
      category: replayable_source_evidence
  audio_event_set.v1:
    description: Thresholded and debounced audio-event intervals with labels and confidence metadata.
    kind: derived_evidence
    modality: audio
    temporal:
      shape: sequence
      clock: event_time
    required_bindings:
    - source_id
    - event_interval
    encodings:
    - name: json
      media_type: application/json
    transport:
      inline_allowed: true
      artifact_reference_allowed: true
      transferable: true
      remote_reference_allowed: true
    retention_class: derived_short
    continuation:
      eligible: true
      category: reusable_evidence
  predicate_match.v1:
    description: Symbolic predicate result with bindings, event time, provenance, and stable occurrence identity.
    kind: symbolic_result
    modality: multimodal
    temporal:
      shape: point_or_interval
      clock: event_time
    required_bindings:
    - event_interval
    encodings:
    - name: json
      media_type: application/json
    transport:
      inline_allowed: true
      artifact_reference_allowed: false
      transferable: true
      remote_reference_allowed: false
    retention_class: symbolic_result
    continuation:
      eligible: false
    semantic_properties:
      preserves:
      - predicate_truth
      - bindings
      - event_time
      - provenance
      does_not_preserve:
      - reinterpretability
  track_summary.v1:
    description: Compact event-time trajectory summary for scoped sensor-local tracks; reconstructable from retained detections.
    kind: derived_evidence
    modality: spatial
    temporal:
      shape: sequence
      clock: event_time
    required_bindings:
    - source_id
    - event_interval
    compatibility_keys:
    - tracker_family
    - track_schema_version
    - coordinate_frame_id
    encodings:
    - name: json
      media_type: application/json
    - name: msgpack
      media_type: application/msgpack
    transport:
      inline_allowed: true
      inline_max_bytes: 262144
      artifact_reference_allowed: true
      transferable: true
      remote_reference_allowed: true
    retention_class: derived_short
    continuation:
      eligible: true
      category: reusable_evidence
    semantic_properties:
      preserves:
      - scoped_local_identity
      - compact_trajectory
      - event_time
      does_not_preserve:
      - tracker_internal_state
      - raw_pixels
  general_visual_embedding_set.v1:
    description: Model-versioned general-purpose visual embeddings; not canonical identity evidence unless explicitly calibrated.
    kind: feature
    modality: vision
    temporal:
      shape: sequence
      clock: event_time
    required_bindings:
    - source_id
    - event_interval
    - local_entity_ids
    compatibility_keys:
    - model_id
    - model_version
    - preprocessing_id
    - dimension
    - normalization
    - distance_metric
    encodings:
    - name: numpy_f32
      media_type: application/x-numpy
    - name: msgpack_f32
      media_type: application/msgpack
    transport:
      inline_allowed: true
      inline_max_bytes: 262144
      artifact_reference_allowed: true
      transferable: true
      remote_reference_allowed: true
    retention_class: derived_short
    continuation:
      eligible: true
      category: reusable_evidence
    semantic_properties:
      preserves:
      - general_visual_similarity
      does_not_preserve:
      - calibrated_identity
      - exact_pixels
      - world_geometry
  vehicle_predicate_observation.v1:
    description: Typed vehicle primitive or derived predicate observation published by a node-local provider.
    kind: predicate_result
    modality: spatial
    temporal:
      shape: instant_or_interval
      clock: event_time
    required_bindings:
    - event_interval
    encodings:
    - name: json
      media_type: application/json
    transport:
      inline_allowed: true
      artifact_reference_allowed: true
      transferable: true
      remote_reference_allowed: true
    retention_class: derived_short
    continuation:
      eligible: false
    semantic_properties:
      preserves:
      - predicate_truth
      - bindings
      - provenance
      - event_time
  microphone_array_geometry.v1:
    description: Microphone positions, array coordinate frame, reference channel, and speed-of-sound calibration.
    kind: deployment_metadata
    modality: audio
    temporal:
      shape: validity_interval
      clock: event_time
    required_bindings:
    - array_id
    - coordinate_frame_id
    encodings:
    - name: json
      media_type: application/json
    transport:
      inline_allowed: true
      artifact_reference_allowed: true
      transferable: true
      remote_reference_allowed: true
    retention_class: deployment_lifetime
    continuation:
      eligible: false
  audio_localization.v1:
    description: Event-time audio bearing, optional zone, delay estimates, residual, and confidence.
    kind: derived_evidence
    modality: audio
    temporal:
      shape: sequence
      clock: event_time
    required_bindings:
    - source_id
    - event_interval
    - array_id
    encodings:
    - name: json
      media_type: application/json
    transport:
      inline_allowed: true
      artifact_reference_allowed: true
      transferable: true
      remote_reference_allowed: true
    retention_class: derived_short
    continuation:
      eligible: true
      category: reusable_evidence
    semantic_properties:
      preserves:
      - audio_direction
      - event_time
      - localization_provenance
  visual_bearing_set.v1:
    description: Visual entity candidates projected into the microphone-array bearing frame.
    kind: derived_evidence
    modality: multimodal
    temporal:
      shape: sequence
      clock: event_time
    required_bindings:
    - source_id
    - event_interval
    encodings:
    - name: json
      media_type: application/json
    transport:
      inline_allowed: true
      artifact_reference_allowed: true
      transferable: true
      remote_reference_allowed: true
    retention_class: derived_short
    continuation:
      eligible: true
      category: reusable_evidence
    semantic_properties:
      preserves:
      - local_entity_identity
      - visual_bearing
      - zone
  audio_visual_association_set.v1:
    description: Angular/temporal associations between one audio occurrence and visual candidates.
    kind: derived_evidence
    modality: multimodal
    temporal:
      shape: sequence
      clock: event_time
    required_bindings:
    - event_interval
    - audio_occurrence_id
    encodings:
    - name: json
      media_type: application/json
    transport:
      inline_allowed: true
      artifact_reference_allowed: true
      transferable: true
      remote_reference_allowed: true
    retention_class: derived_short
    continuation:
      eligible: true
      category: reusable_evidence
    semantic_properties:
      preserves:
      - association_score
      - candidate_identity
      - event_time
  speech_segment_set.v1:
    description: VAD-selected speech intervals without transcript content.
    kind: derived_evidence
    modality: audio
    temporal:
      shape: sequence
      clock: event_time
    required_bindings:
    - source_id
    - event_interval
    encodings:
    - name: json
      media_type: application/json
    transport:
      inline_allowed: true
      artifact_reference_allowed: true
      transferable: true
      remote_reference_allowed: true
    retention_class: derived_short
    continuation:
      eligible: true
      category: reusable_evidence
    semantic_properties:
      preserves:
      - speech_activity
      - event_time
  speaker_embedding_set.v1:
    description: Model-versioned speaker embeddings for VAD-selected intervals.
    kind: feature
    modality: audio
    temporal:
      shape: sequence
      clock: event_time
    required_bindings:
    - source_id
    - event_interval
    encodings:
    - name: json
      media_type: application/json
    transport:
      inline_allowed: true
      artifact_reference_allowed: true
      transferable: true
      remote_reference_allowed: true
    retention_class: derived_short
    continuation:
      eligible: true
      category: reusable_evidence
    compatibility_keys:
    - model_id
    - model_version
    - preprocessing_id
    - dimension
    - normalization
    - distance_metric
    semantic_properties:
      preserves:
      - speaker_similarity
      - event_time
  speaker_turn_set.v1:
    description: Diarized speaker turns with optional transcript references.
    kind: derived_evidence
    modality: audio
    temporal:
      shape: sequence
      clock: event_time
    required_bindings:
    - source_id
    - event_interval
    encodings:
    - name: json
      media_type: application/json
    transport:
      inline_allowed: true
      artifact_reference_allowed: true
      transferable: true
      remote_reference_allowed: true
    retention_class: derived_short
    continuation:
      eligible: true
      category: reusable_evidence
    compatibility_keys:
    - diarization_model_id
    - diarization_model_version
    semantic_properties:
      preserves:
      - speaker_turns
      - event_time
  transcript_event_set.v1:
    description: Task-scoped keyword or transcript matches produced only when semantic content is required.
    kind: derived_evidence
    modality: audio
    temporal:
      shape: sequence
      clock: event_time
    required_bindings:
    - source_id
    - event_interval
    encodings:
    - name: json
      media_type: application/json
    transport:
      inline_allowed: true
      artifact_reference_allowed: true
      transferable: true
      remote_reference_allowed: true
    retention_class: derived_short
    continuation:
      eligible: true
      category: reusable_evidence
    semantic_properties:
      preserves:
      - requested_speech_content
      - event_time
  interaction_evidence_set.v1:
    description: High-resolution package/person/vehicle interaction evidence used to resolve custody change.
    kind: derived_evidence
    modality: multimodal
    temporal:
      shape: sequence
      clock: event_time
    required_bindings:
    - source_id
    - event_interval
    encodings:
    - name: json
      media_type: application/json
    transport:
      inline_allowed: true
      artifact_reference_allowed: true
      transferable: true
      remote_reference_allowed: true
    retention_class: derived_short
    continuation:
      eligible: true
      category: reusable_evidence
    semantic_properties:
      preserves:
      - interaction_geometry
      - package_continuity
      - event_time
  custody_state.v1:
    description: Compact package-to-holder bindings and transfer provenance retained across checkpoints.
    kind: derived_evidence
    modality: multimodal
    temporal:
      shape: validity_interval
      clock: event_time
    required_bindings:
    - source_id
    - event_interval
    encodings:
    - name: json
      media_type: application/json
    transport:
      inline_allowed: true
      artifact_reference_allowed: true
      transferable: true
      remote_reference_allowed: true
    retention_class: derived_short
    continuation:
      eligible: true
      category: reusable_evidence
    semantic_properties:
      preserves:
      - package_identity
      - current_holder
      - previous_holder
      - transfer_provenance
  interaction_predicate_observation.v1:
    description: Typed DISEMBARKS, BOARDS, CONVERSATION, TRANSFER, or audio-visual predicate evidence.
    kind: predicate_result
    modality: multimodal
    temporal:
      shape: instant_or_interval
      clock: event_time
    required_bindings:
    - event_interval
    encodings:
    - name: json
      media_type: application/json
    transport:
      inline_allowed: true
      artifact_reference_allowed: true
      transferable: true
      remote_reference_allowed: true
    retention_class: derived_short
    continuation:
      eligible: false
    semantic_properties:
      preserves:
      - predicate_truth
      - bindings
      - event_time
      - provenance
