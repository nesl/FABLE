version: 1
node: {node_id: sensor1, node_type: sensor}
runtime: dataflow
transport: mqtt
mqtt: {host: 10.253.0.1, port: 1884}
system_probe: false
# Keep alternate placements model-ready so a network-driven edge-to-sensor
# handoff does not lose replay frames to one-time YOLO initialization.
prewarm_providers: [yolo_vehicle_fast_640, yolo_full_context_960]
mqtt_video_relay: {enabled: true, jpeg_quality: 70, max_fps: 4}
replay_manifest: /etc/fable/replay.yaml
