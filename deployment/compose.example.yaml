services:
  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    ports:
      - "${FABLE_MQTT_HOST_PORT:-1883}:1883"
    restart: unless-stopped

  controller:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    depends_on:
      - mqtt
    restart: unless-stopped

  sensor1-agent:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    depends_on:
      - mqtt
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  mqtt-data:
