# Run this on each physical node after copying and editing node_agent.yaml.
services:
  node-agent:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: fable/node-agent:refactor
    command: ["scripts/run_node_agent.py", "/etc/fable/node_agent.yaml"]
    environment:
      FABLE_YOLO_DEVICE: cuda:0
    volumes:
      - ./node_agent.yaml:/etc/fable/node_agent.yaml:ro
      - ${RECORDING_ROOT:-../replay}:/recordings:ro
      - fable-state:/var/lib/fable
      # Required only when runtime: docker is selected.
      - /var/run/docker.sock:/var/run/docker.sock
    devices:
      # Remove on non-NVIDIA nodes; Jetson deployments commonly need these.
      - /dev/video0:/dev/video0
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  fable-state:
